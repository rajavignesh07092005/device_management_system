<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Device Management Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Device Management — Admin Panel</h1>
<p><a href="download.html">Download the Device Agent →</a></p>

<!-- Section 1: Login -->
<section id="login-section">
    <h2>Admin Login</h2>
    <input type="text" id="login-username" placeholder="Username">
    <input type="password" id="login-password" placeholder="Password">
    <button onclick="handleLogin()">Login</button>
    <p id="login-status"></p>
</section>

<!-- Section 2: Send Command -->
<section id="command-section" class="hidden">
    <h2>Send Command</h2>
    <label for="command-device-id">Select Device</label>
    <select id="command-device-id"></select>
    <input type="text" id="command-text" placeholder="Command text">
    <button onclick="handleSendCommand()">Send Command</button>
    <p id="command-status"></p>
</section>

<!-- Section 3: View History -->
<section id="history-section" class="hidden">
    <h2>Command History</h2>
    <label for="history-device-id">Select Device</label>
    <select id="history-device-id"></select>
    <button onclick="handleViewHistory()">View History</button>
    <table id="history-table">
        <thead>
        <tr><th>Command ID</th><th>Status</th><th>Changed At</th></tr>
        </thead>
        <tbody id="history-body"></tbody>
    </table>
</section>

<!-- Section 4: Create Admin -->
<section id="create-admin-section" class="hidden">
    <h2>Create New Admin</h2>
    <input type="text" id="new-admin-username" placeholder="New admin username">
    <input type="password" id="new-admin-password" placeholder="New admin password">
    <button onclick="handleCreateAdmin()">Create Admin</button>
    <p id="create-admin-status"></p>
</section>

<!-- Section 5: Revoke Device Token -->
<section id="revoke-section" class="hidden">
    <h2>Revoke Device Token</h2>
    <label for="revoke-device-id">Select Device</label>
    <select id="revoke-device-id"></select>
    <button onclick="handleRevoke()">Revoke Token</button>
    <p id="revoke-status"></p>
</section>

<!-- Section 6: Logout -->
<section id="logout-section" class="hidden">
    <button onclick="handleLogout()">Logout</button>
</section>

<script src="script.js"></script>
</body>
</html>
